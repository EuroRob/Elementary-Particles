# =============================================================================
# Traefik v3 — Static Configuration
# File: IaC/services/platform/traefik/traefik.yml
# Deployed to: /etc/traefik/traefik.yml on web-01
# =============================================================================

# --- Global ------------------------------------------------------------------
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# --- API / Dashboard ---------------------------------------------------------
api:
  dashboard: true
  insecure: false        # dashboard accessible only via a dedicated router below

# --- Log level ---------------------------------------------------------------
log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Authorization: redact

# --- Entry points ------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls: {}                   # apply default cert to all websecure routers

  traefik_api:
    address: ":8080"

# --- Providers ---------------------------------------------------------------
providers:
  # Docker provider — auto-discovers containers on web-01
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: traefik              # only containers on this network are discovered
    exposedByDefault: false       # must set traefik.enable=true per container
    watch: true

  # File provider — external/cross-VM routes, middleware definitions
  # Traefik hot-reloads all files in this directory — no restart needed
  file:
    directory: /etc/traefik/dynamic
    watch: true

# --- TLS ---------------------------------------------------------------------
# Using an internal wildcard cert for *.internal domains.
# To switch to ACME/Let's Encrypt via Cloudflare DNS challenge, replace this
# section with the certificatesResolvers block (commented below).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/wildcard.internal.crt
        keyFile:  /etc/traefik/certs/wildcard.internal.key

# ACME / Let's Encrypt (uncomment if using public certs with Cloudflare DNS):
# certificatesResolvers:
#   cloudflare:
#     acme:
#       email: "YOUR_EMAIL"
#       storage: /etc/traefik/acme.json
#       dnsChallenge:
#         provider: cloudflare
#         resolvers:
#           - "1.1.1.1:53"
#           - "1.0.0.1:53"
