# =============================================================================
# Traefik docker-compose.yml
# File: IaC/services/platform/traefik/docker-compose.yml
# Deployed on: web-01 (10.10.30.10)
#
# Key design decisions:
#   - Static config mounted from /etc/traefik/traefik.yml
#   - Dynamic config dir /etc/traefik/dynamic/ is file-provider watched directory.
#     The traefik_register Ansible role writes one .yml per remote service here.
#   - Authelia container is on the same Docker network (traefik) so the
#     authelia@docker forwardauth middleware is auto-discovered.
#   - Dashboard is NOT exposed on 8080 publicly — requires an explicit router
#     defined in dynamic/dashboard.yml (generated by deploy_traefik.yml).
# =============================================================================

services:

  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    # Hard cap so no single container can eat the host's RAM — see
    # incident_web01_memory_exhaustion_2026-08-25 memory note.
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"    # loopback only — accessed via socket or SSH tunnel
    environment:
      # Docker 28+ raised minimum API to 1.40; Traefik 3.1.x negotiates from 1.24.
      # Set explicitly to skip the negotiation failure.
      DOCKER_API_VERSION: "1.47"
    env_file:
      # Written by Ansible install.yml from Vault secret/traefik/acme.
      # Contains: IONOS_API_KEY=public_prefix.secret
      # File is created (empty) even when traefik_acme_enabled=false.
      - .env
    volumes:
      # Static config
      - /etc/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic config dir — file provider watches this
      - /etc/traefik/dynamic:/etc/traefik/dynamic:ro
      # TLS certificates (internal CA)
      - /etc/traefik/certs:/etc/traefik/certs:ro
      # ACME storage — Traefik writes and renews acme.json here (must be rw)
      - /etc/traefik/acme:/etc/traefik/acme
      # Docker socket — read-only is sufficient for provider discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Access log
      - traefik_logs:/var/log/traefik
    networks:
      - traefik
      - monitoring
    labels:
      # Dashboard route is defined in /etc/traefik/dynamic/acme-wildcard.yml
      # (file provider) so it can use certResolver: letsencrypt for the wildcard cert.
      traefik.enable: "false"
      app.managed-by: "elementary-particles"
      app.tier: "platform"
      app.service: "traefik"

volumes:
  traefik_logs:
    driver: local
    driver_opts:
      type: none
      device: /var/log/traefik
      o: bind

networks:
  traefik:
    external: true
    name: traefik
  monitoring:
    external: true
    name: monitoring
