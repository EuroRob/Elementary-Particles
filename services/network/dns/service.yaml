---
name: dns
version: "1.0"
tier: "network"
description: "DNS server - Pi-hole for network-wide ad blocking and DNS management"
owner: "network-team"
runbook: "https://docs.internal/dns-runbook"

tags:
  expose: "false"
  ingress: "tcp"
  auth: "none"
  auth_provider: "none"
  network: "vlan30"
  dns: "true"
  tier: "network"
  category: "DNS"
  icon: "globe"
  color: "#95E1D3"
  sla: "critical"
  backup: "daily"
  owner: "network-infra"
  environment: "production"
  data_classification: "internal"
  dns_provider: "true"

deployment:
  platform: "docker"
  deployment_target: "dns-vm"
  namespace: "network"
  replicas: 1
  resources:
    cpu: "2"
    memory: "2Gi"
    storage: "10Gi"
  datastore: "ssd"

services:
  - name: "pihole"
    image: "pihole/pihole:latest"
    port: 80
    https_port: 443
    dns_port: 53
    description: "Pi-hole DNS and ad blocker"

interfaces:
  - name: "dns-udp"
    protocol: "udp"
    port: 53
    internal_port: 53
    
  - name: "dns-tcp"
    protocol: "tcp"
    port: 53
    internal_port: 53
    
  - name: "web-ui"
    protocol: "tcp"
    port: 80
    internal_port: 80
    
  - name: "web-ui-https"
    protocol: "tcp"
    port: 443
    internal_port: 443
    
  - name: "dhcp"
    protocol: "udp"
    port: 67
    internal_port: 67

ingress:
  - name: "pihole-admin"
    enabled: true
    traefik_router: true
    host: "pihole.internal"
    port: 80
    protocol: "http"
    tls: true
    auth: true
    auth_provider: "authelia"

dependencies: []

provides:
  - interface: "udp:53"
    for_services: ["all"]
    contract: "DNS over UDP"
    documentation: "https://docs.pi-hole.net/"
    
  - interface: "tcp:53"
    for_services: ["all"]
    contract: "DNS over TCP"
    documentation: "https://docs.pi-hole.net/"
    
  - interface: "tcp:80"
    for_services: ["all"]
    contract: "Pi-hole Admin Dashboard"
    documentation: "https://docs.pi-hole.net/"

secrets:
  - name: "PIHOLE_WEBPASSWORD"
    vault_path: "secrets/dns/pihole"

monitoring:
  health_check: "dig @localhost google.com || exit 1"
  health_check_interval: "30s"
  health_check_timeout: "5s"
  unhealthy_threshold: 3
  metrics_endpoint: "http://localhost:9100/metrics"
  alert_rules:
    - name: "dns_unavailable"
      condition: "dns_queries_failed > 0.05"
      severity: "critical"
    - name: "gravity_stale"
      condition: "gravity_updated > 604800"
      severity: "warning"
    - name: "cache_hitrate_low"
      condition: "cache_hitrate < 30"
      severity: "warning"
    - name: "memory_usage_high"
      condition: "memory_usage > 80"
      severity: "warning"

backup:
  enabled: true
  schedule: "0 4 * * *"
  retention: "30d"
  target: "s3:http://nas-01.internal:9000/restic/dns"
  backup_configs: true

networking:
  vlan: "vlan30"
  dns_enabled: true
  dns_names:
    - "dns.internal"
    - "pihole.internal"
  internal_access_only: true
  allow_from_all_vlan: true

metadata:
  data_classification: "internal"
  cost_center: "infrastructure"
  business_impact: "critical"
  backup_required: true
  service_suite: "network-layer"
  redundancy_required: true
