---
# =============================================================================
# WireGuard VPN — vpn-01
# docker-compose.yml
#
# Runs wg-easy (WireGuard + Web UI) as a privileged Docker container.
# WireGuard itself runs at the kernel level; Docker only wraps the
# management layer and web UI so peer configs can be managed without SSH.
#
# Prerequisites:
#   - wireguard-tools and linux-headers installed on the host (Ansible role)
#   - ip_forward = 1 enabled on the host (Ansible role)
#   - iptables MASQUERADE rule configured on eth0 (Ansible role)
#
# Environment variables sourced from /opt/wireguard/.env (managed by Ansible/Vault)
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # wg-easy — WireGuard kernel + web management UI
  # ---------------------------------------------------------------------------
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    hostname: vpn-01

    # PASSWORD_HASH and JWT_SECRET come from wg_secrets.env via env_file.
    # Using a non-.env filename avoids Docker Compose auto-loading it for YAML
    # variable substitution (which corrupts bcrypt $ chars via interpolation).
    env_file:
      - wg_secrets.env

    environment:
      # Public-facing hostname or IP that peers use to reach this server.
      WG_HOST: "${WG_HOST}"

      # WireGuard server configuration
      WG_PORT: "51820"
      WG_INTERFACE: "wg0"
      WG_MTU: "1420"
      WG_PERSISTENT_KEEPALIVE: "25"

      # DNS pushed to all VPN clients → Pi-hole on DNS-01 (vlan30).
      # DELIBERATELY no fallback: if Pi-hole is unreachable, DNS fails visibly
      # rather than silently bypassing filtering to a public resolver.
      # Quad9 / external DNS belongs as Pi-hole's UPSTREAM, not here.
      # Additionally, dns_enforcement.yml adds iptables DNAT on wg0 so clients
      # cannot bypass Pi-hole even by manually specifying a different resolver.
      WG_DEFAULT_DNS: "${PIHOLE_IP:-10.10.30.10}"

      # Allowed IPs pushed to clients — sourced from .env (Roles/wireguard/
      # templates/wg_easy.env.j2, driven by the wireguard_allowed_ips role
      # variable), NOT hardcoded here. Was a hardcoded split-tunnel literal
      # until 2026-08-15 that silently never matched the role's own
      # documented/intended value — see wireguard_allowed_ips in
      # Roles/wireguard/defaults/main.yml for the real source of truth and
      # the full story on how this drifted.
      WG_ALLOWED_IPS: "${WG_ALLOWED_IPS}"

      # WireGuard server subnet
      WG_DEFAULT_ADDRESS: "10.8.0.x"

      # Web UI port
      PORT: "51821"

      # Locale
      LANG: "en"

      # UI settings
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: "1"

    volumes:
      # WireGuard config — wg0.conf, peer configs, keys
      - wireguard_data:/etc/wireguard

    ports:
      # WireGuard UDP — must be port-forwarded on the physical firewall
      - "51820:51820/udp"
      # Web UI — proxied by Traefik, NOT exposed directly to the internet
      - "127.0.0.1:51821:51821/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    # sysctls are NOT used with host network mode — all kernel params are set on
    # the host by Ansible routing.yml (ip_forward, src_valid_mark).

    # The host network namespace is needed for WireGuard to create the wg0
    # interface that the kernel can route through.
    network_mode: host

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:51821/api/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    labels:
      # Traefik discovery
      traefik.enable: "true"
      traefik.http.routers.wg-easy.rule: "Host(`vpn.internal`)"
      traefik.http.routers.wg-easy.entrypoints: "websecure"
      traefik.http.routers.wg-easy.tls: "true"
      traefik.http.routers.wg-easy.tls.certresolver: "letsencrypt"
      traefik.http.routers.wg-easy.middlewares: "authelia@docker"
      traefik.http.services.wg-easy.loadbalancer.server.port: "51821"
      # Authelia two-factor policy
      traefik.http.middlewares.wg-easy-auth.forwardauth.address: "http://authelia:9091/api/authz/forward-auth"
      traefik.http.middlewares.wg-easy-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.wg-easy-auth.forwardauth.authResponseHeaders: "Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      # Elementary particles metadata
      app.tier: "network"
      app.service: "wireguard"
      app.managed-by: "elementary-particles"

  # ---------------------------------------------------------------------------
  # wireguard-exporter — Prometheus metrics for WireGuard peers
  # ---------------------------------------------------------------------------
  wireguard-exporter:
    image: mindflavor/prometheus-wireguard-exporter:latest
    container_name: wireguard-exporter
    network_mode: host
    privileged: true           # needs access to wg show
    # The image CMD is [-a] which passes --prepend_sudo without a required value,
    # crashing the Rust arg parser. Override the full entrypoint to pass -a false
    # explicitly so no sudo is prepended (container is already privileged).
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/prometheus_wireguard_exporter", "-a", "false"]
    environment:
      PROMETHEUS_WIREGUARD_EXPORTER_ADDRESS: "0.0.0.0"
      PROMETHEUS_WIREGUARD_EXPORTER_PORT: "9586"
      PROMETHEUS_WIREGUARD_EXPORTER_VERBOSE_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      wg-easy:
        condition: service_healthy
    labels:
      app.tier: "network"
      app.service: "wireguard-exporter"
      app.managed-by: "elementary-particles"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  wireguard_data:
    name: wireguard_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/wireguard/config
