# Drift: re-run the checks for every open pull request against the current master.
# Runs after each push to master and every six hours. Verdict = commit status
# `checks-drift` on the PR head (+ a comment when it changes). Same runner, same
# ephemeral job token as checks; no stored credential. See scripts/ci/drift.py.
name: drift

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ci-host
    steps:
      - name: Fetch the tooling commit and master
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@10.10.30.31:3000/${REPO}.git"
          # the scripts come from the commit that triggered this run (= master on push/schedule);
          # the PRs are always judged against origin/master
          git -c protocol.version=2 fetch -q --filter=blob:none origin "$SHA" "+refs/heads/master:refs/remotes/origin/master"
          git checkout -q "$SHA"
          echo "tooling $(git rev-parse --short HEAD), master $(git rev-parse --short origin/master)"

      - name: Re-validate open pull requests against master
        env:
          FORGEJO_API: http://10.10.30.31:3000/api/v1
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: master
          RUN_URL: https://git.home.example.org/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: python3 scripts/ci/drift.py
