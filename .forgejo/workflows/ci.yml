# Repository checks on every pull request and on the default branch.
# Runner: forgejo_runner role on code-01 (host mode, network pinned to git-01), so
# no external action is used: the checkout is a plain git fetch from git-01.
name: checks

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  checks:
    runs-on: ci-host
    steps:
      - name: Fetch the commit under review
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          set -eu
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@10.0.30.31:3000/${REPO}.git"
          git -c protocol.version=2 fetch -q --filter=blob:none origin "$SHA" "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          git checkout -q "$SHA"
          echo "checked out $(git rev-parse --short HEAD), base origin/${BASE} = $(git rev-parse --short "origin/${BASE}")"

      - name: Run the checks
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: scripts/ci/check.sh
