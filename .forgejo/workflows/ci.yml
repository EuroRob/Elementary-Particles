# Repository checks on every pull request and on the default branch.
# Runner: forgejo_runner role on code-01 (host mode, network pinned to git-01), so
# no external action is used: the checkout is a plain git fetch from git-01.
name: checks

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  checks:
    runs-on: ci-host
    steps:
      - name: Fetch the commit under review
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          set -eu
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          git remote add origin "http://x-access-token:${TOKEN}@10.10.30.31:3000/${REPO}.git"
          git -c protocol.version=2 fetch -q --filter=blob:none origin "$SHA" "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          git checkout -q "$SHA"
          echo "checked out $(git rev-parse --short HEAD), base origin/${BASE} = $(git rev-parse --short "origin/${BASE}")"

      # The gate runs from the base branch, not from the commit under review: a pull
      # request cannot weaken the checks that judge it. Changes to the gate itself take
      # effect once they are merged. (The workflow file is still read from the PR head;
      # that part is Forgejo's, and a reviewer sees any diff under .forgejo/.)
      - name: Take the gate from the base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          GATE="scripts/ci .gitleaks.toml .forgejo"
          if ! git diff --quiet "origin/${BASE}" HEAD -- $GATE; then
            echo "::notice::this pull request changes the gate itself:"
            git diff --stat "origin/${BASE}" HEAD -- $GATE
          fi
          git checkout -q "origin/${BASE}" -- scripts/ci .gitleaks.toml

      - name: Run the checks
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: scripts/ci/check.sh
