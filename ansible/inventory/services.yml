          # VM specs — real current usage (confirmed live 2026-08-16) is only
          # 2 vCPU/6GB/66GB; these give headroom per the migration doc's
          # Target Architecture table.
          # Trimmed 8GB->6GB 2026-08-19 (pve-01-wide memory pressure, see
          # project_pve-01_swap_memory_incident memory) — HA was only using
          # ~5GB live, 6GB still leaves ~1GB/17% headroom above that.
          vm_tier: application
          vm_memory_gb: 6
          vm_cpus: 4
          vm_datastore: zfs-nvme
          vm_vlan: vlan30
          proxmox_node: pve-01   # must stay pve-01 — the Zigbee USB dongle is physically attached there
          proxmox_vm_id: 282    # next free after jellyfin-01 (281), confirmed live 2026-08-16
          health_check_port: 8123
          health_check_url: "http://10.10.30.14:8123/"
          # HA Core needs 2-4 min after a reboot (Supervisor starts it after Docker);
          # the fleet default of 12 x 10s would roll a healthy patch back.
          rolling_update_health_retries: 36
          rolling_update_health_timeout: 360

          # Docker (HA Supervised runs on top of Docker, but is NOT a
          # docker-compose stack like the other particles — Roles/home_assistant
          # installs it via the official Supervised installer, not compose_dir)
          docker_enabled: "true"
          docker_version: latest

          # ---- HA configuration lives ON THE HOST, not in this repo ----------
          # /var/lib/homeassistant/homeassistant/ (= /config in the container):
          # configuration.yaml, secrets, and .storage/ (UI-configured
          # integrations incl. application_credentials). Kept there on purpose
          # because these files contain credentials. To change: ssh in, back up
          # first (`install -m 0600 <file> <file>.bak-<date>`), edit, then
          # `docker exec homeassistant python -m homeassistant --script
          # check_config -c /config` before any restart. Never cat/print these
          # files; redact client_id/client_secret/token lines when viewing.
          # 2026-09-29: removed the obsolete YAML `spotify:` block (Spotify is
          # UI-configured; backup configuration.yaml.bak-20260929-spotify).
          # 2026-10-23: removed the dead AskMixtral intent_script + the first
          # `rest_command:` block (ask_open_webui -> 10.10.0.12:3000, gone) that
          # duplicated the key; backup configuration.yaml.bak-20261023005439.
          ha_config_dir: /var/lib/homeassistant/homeassistant

          # ---- Zigbee coordinator (USB passthrough, configured in Terraform) --
          # Confirmed live 2026-08-16: Sonoff Zigbee 3.0 USB Dongle Plus,
          # vendor:product 10c4:ea60, 4 real devices paired via ZHA. See
          # Terraform/envs/home-assistant/main.tf `usb` block.
          zigbee_usb_id: "10c4:ea60"

          # ---- GPS / mobile_app — already live on the current instance, this
          # migration's job is to confirm it survives backup/restore, not to
          # build it. See HOME_ASSISTANT_MIGRATION.md "GPS / location tracking".
          mobile_app_device_count: 11   # confirmed live 2026-08-16, for the post-restore rehearsal check

          # Vault paths (see migration doc section 4)
          vault_home_assistant_api_path: secret/home-assistant/api          # keys: token, url
          vault_influxdb_path: secret/influxdb/homeassistant                 # key: token
          vault_esphome_path: secret/esphome/api                             # keys: encryption_key, ota_password
          vault_mqtt_path: secret/mqtt/homeassistant                         # key: password

          # Monitoring
          node_exporter_port: 9100
          docker_exporter_port: 9323
          prometheus_scrape_interval: "60s"

          # Backup — nightly Proxmox vzdump of VM 282 (pve-01 job, all VMs) plus
          # HA's own daily automatic partial backup (service.yaml "vzdump+native")
          backup_strategy: vzdump+native-ha-backup

          # Tags — mirrors IaC/services/assistant/home-assistant/service.yaml
          tier: assistant
          criticality: high   # mediates voice pipeline + physical-security-adjacent devices
          app_platform: home-assistant
          expose: "true"
          auth: none          # HA has its own native auth; no Authelia/Traefik in front today
          sla: high
          data_classification: sensitive

