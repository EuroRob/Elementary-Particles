          tier: application
          criticality: medium
          app_platform: immich
          expose: "true"
          auth: oidc
          sla: medium

        jellyfin-01:
          # Plex replacement — decided 2026-08-13, originally built on
          # pve-01/pve-01. Migrated pve-01->pve-03 ad hoc 2026-09-13 (real,
          # live, serving traffic before Terraform/inventory knew about
