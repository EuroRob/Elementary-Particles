    #########################################
    # TIER-DMZ: DMZ SERVICES
    #########################################
    tier_dmz:
      hosts:
        # nc-01 (old bare-metal NextCloudPi, VMID 260, 172.16.0.21) was
        # decommissioned 2026-09-09 in favor of dmz-nc-01 below, kept powered
        # off as a rollback, then actually deleted 2026-09-20 (backups exist
        # on nfs-backups). secret/nextcloud/ssh in Vault is now moot -- safe
        # to remove whenever convenient. Full migration history: see
        # NC01_DMZ_MIGRATION_PLAN.md.

        # PRODUCTION as of 2026-09-09 -- this is now the live, real
        # Nextcloud instance for the household. 172.16.0.30 is its
        # PERMANENT address, not a temp build IP -- the original plan
        # (take over nc-01's literal IP, 172.16.0.21, in-place) was
        # superseded by a DNS-level cutover instead: Pi-hole's
        # cloud.home.example.org record now points here directly, and the WAN
        # port-forward (fw-01, TCP 80/443) was already retargeted here
        # in an earlier session. nc-01 (172.16.0.21, VM 260) keeps its
        # own IP as a powered-off rollback -- see its entry above.
        # Real Let's Encrypt cert live for cloud.home.example.org. Full data
        # migration (calendars/contacts/bookmarks/files, 84.3GB) done
        # 2026-09-09 -- see NC01_DMZ_MIGRATION_PLAN.md Sessions 4-5.
        dmz-nc-01:
          ansible_host: 172.16.0.30     # PERMANENT production IP on DMZ (vtnet2, 172.16.0.0/24) -- not temporary
          # Added 2026-09-09: deploy_nextcloud.yml's nc_domain/
          # nc_use_internal_tls previously had NO inventory-driven default
          # -- only an env-var override (-e NC_DOMAIN=.../-e
          # nc_use_internal_tls=false) or a hardcoded self-signed/bare-IP
          # fallback baked into the play itself. A bare re-run (forgetting
          # those -e flags -- which happened for real, twice, the same
          # session this was fixed) silently reverted the live site to a
          # self-signed cert and briefly broke it (empty NC_DOMAIN crashed
          # Caddy's config entirely). Since this is now permanent
          # production, its correct values belong here as the real
          # source of truth, not as something every future run must
          # remember to pass by hand.
          nc_domain: cloud.home.example.org
          nc_use_internal_tls: false
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible

          # VM specs
          # Corrected 2026-09-08 against live nc-01 (VM 260) config, checked
          # via the Proxmox API before writing this: real pool names on pve-01
          # are "zfs-nvme" and "SSDs" -- "zfs-nvme-vms" (below) doesn't exist,
          # see IaC/CLAUDE.md's known-fictional-pool-names note. nc-01 actually
          # runs a SECOND disk for Nextcloud's data dir (88GB used today,
          # confirmed via `occ config:system:get datadirectory` ->
          # /media/USBdrive/ncdata) -- the OS disk alone was never enough.
          # See IaC/docs/NC01_DMZ_MIGRATION_PLAN.md for the full sizing writeup.
          vm_tier: dmz
          # Scaled down 2026-09-08 from 6 -- the original figure was a
          # guess, not real numbers, and (combined with dmz-pg-01's own
          # oversized default) directly caused a real pve-01 memory-
          # overcommit crash. Live data point: current nc-01 (VM 260)
          # runs its ENTIRE stack (Apache+PHP-FPM+MariaDB together) in
          # 1.5GB at under 80% utilized. dmz-nc-01 only needs the app
          # side (DB moves to dmz-pg-01), so 2GB should cover Docker's
          # own overhead plus Caddy+coturn+redis alongside PHP-FPM. See
          # NC01_DMZ_MIGRATION_PLAN.md's incident note -- treat as a
          # first cut, watch real usage once Phase 2 actually runs.
          vm_memory_gb: 2
          vm_cpus: 2
          vm_datastore: zfs-nvme        # OS disk only (was: zfs-nvme-vms, fictional)
          vm_data_datastore: SSDs       # NEW -- second disk for Nextcloud data volume
          vm_data_disk_gb: 200          # sized for current 88GB used + real headroom
          vm_vlan: dmz               # OPNSense vtnet2 — not a VLAN tag, physical DMZ port
          proxmox_node: pve-01
          proxmox_vm_id: 200
          health_check_port: 443      # Nextcloud HTTPS via Caddy
          health_check_url: "https://cloud.home.example.org/status.php"   # 2026-10-16 audit: the check runs on the IaC VM, which the DMZ firewall keeps off 172.16.0.30:443
          docker_enabled: "true"
          docker_compose_dirs:
            - /opt/nextcloud

          # Docker Compose stack: nextcloud + redis + caddy + coturn
          compose_dir: /opt/nextcloud
          postgres_host: "172.16.0.22"     # dmz-pg-01

          # Vault paths
          vault_nc_path: secret/nextcloud/dmz

          # Backup (Restic → MinIO on nas-01)
          # NOTE: DMZ VMs need a VLAN-routed path to nas-01 (10.10.40.20).
          # OPNSense rule: VLAN200 → VLAN40:9000 ALLOW (add to opnsense role).
          backup_type: restic
          backup_destination: "s3:http://nas-01.internal:9000/restic/dmz-nc-01"
          restic_jobs:
            - name: nextcloud-volumes
              type: files
              paths:
                - /opt/nextcloud/config          # NextCloud config volume
                - /opt/nextcloud/data            # NextCloud user data volume
                - /opt/nextcloud/caddy           # Caddy certs + config
              schedule: "03:00"                 # After nightly maintenance window
              tags: ["nextcloud", "dmz"]

          # Tags
          tier: dmz
          criticality: high
          expose_external: "true"

        dmz-pg-01:
          ansible_host: 172.16.0.22     # dmz-pg-01 on DMZ (vtnet2, 172.16.0.0/24)
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible

          # VM specs
          vm_tier: dmz
          # Scaled down 2026-09-08 from 4 -- guessed, not measured, and
          # (combined with dmz-nc-01's own oversized default) directly
          # caused a real pve-01 memory-overcommit crash. 2GB for a
          # single-tenant Postgres serving one Nextcloud instance should
          # be plenty -- postgres_shared_buffers/effective_cache_size
          # below are scaled down to match (25%/50% of this value), not
          # left sized for the old 4GB ceiling. See NC01_DMZ_MIGRATION_
          # PLAN.md's incident note; watch real usage once Phase 2 runs.
          vm_memory_gb: 2
          vm_cpus: 2
          # Corrected 2026-09-08: "zfs-nvme-vms"/"zfs-ssd-vms" don't exist on
          # pve-01 (real pools: "zfs-nvme", "SSDs" -- see IaC/CLAUDE.md). Not
          # yet re-verified against a live headroom check for dmz-pg-01
          # specifically -- flagged as open in NC01_DMZ_MIGRATION_PLAN.md.
          vm_datastore: zfs-nvme        # OS + data disk; WAL colocated for now
          vm_vlan: dmz               # OPNSense vtnet2 — not a VLAN tag, physical DMZ port
          proxmox_node: pve-01           # Core host — DMZ bridge lives here
          proxmox_vm_id: 201
          health_check_port: 22         # 2026-10-16 audit: 5432 is closed to the IaC VM (DMZ firewall), where the check runs
          docker_enabled: "false"

          # PostgreSQL configuration
          postgres_version: 16
          postgres_port: 5432
          postgres_data_dir: /pgdata/pg_data    # scsi1 (zfs-nvme, 60G)
          postgres_wal_dir: /wal/pg_wal          # scsi2 (SSDs, 20G — separate SSD pool)
          postgres_listen_address: "172.16.0.22"
          postgres_max_connections: 50
          # Scaled down 2026-09-08 alongside vm_memory_gb (4GB -> 2GB,
          # see above) -- these were still sized for the old ceiling
          # before this edit, which would have left too little RAM for
          # the OS + connection overhead on the smaller VM. Standard
          # starting ratios: shared_buffers ~25% of RAM, effective_cache_
          # size ~50%.
          postgres_shared_buffers: "512MB"
          postgres_effective_cache_size: "1GB"
          postgres_wal_buffers: "16MB"

          # Access restriction: dmz-nc-01's address, now PERMANENT --
          # corrected 2026-09-09. The originally-planned IP takeover
          # (dmz-nc-01 moving to .21) did not happen; a DNS-level cutover
          # was used instead (see dmz-nc-01's own inventory comment and
          # NC01_DMZ_MIGRATION_PLAN.md Session 5), so .30 stays correct
          # with no further change needed here.
          postgres_allowed_client: "172.16.0.30/32"    # dmz-nc-01 (permanent production IP)
          postgres_db: nextcloud
          postgres_user: nextcloud

          # Vault paths
          vault_postgres_path: secret/nextcloud/dmz/postgres

          # Backup (Restic → MinIO on nas-01)
          # pg_dump is piped directly into restic stdin — no temp files on disk.
          # Full PGDATA dir backup also runs for binary-level restore option.
          backup_type: restic
          backup_destination: "s3:http://nas-01.internal:9000/restic/dmz-pg-01"
          restic_jobs:
            - name: nextcloud-pgdump
              type: postgres
              postgres_db: nextcloud
              postgres_user: nextcloud
              postgres_host: "127.0.0.1"
              schedule: "01:00"                 # Ahead of nc-01 backup at 03:00
              tags: ["postgres", "dmz", "nextcloud"]

            - name: nextcloud-pgdata-files
              type: files
              paths:
                - /pgdata/pg_data               # Binary data dir (for PITR restore)
                - /etc/postgresql               # pg config files
              schedule: "01:30"                 # After pg_dump job
              exclude:
                - "*.pid"
                - "postmaster.pid"
              tags: ["postgres", "dmz"]

          # Tags
          tier: dmz
          criticality: high
          postgres_role: primary
          wal_enabled: "true"

    # ── Patch-managed groups ──────────────────────────────────────────────────
    # Used by rolling_update.yml as the default target scope.
    # Excludes: PVE hypervisors (pve-01/02/03), bare-metal (nas-01/gpu-01),
    #           and OPNSense (fw-01) — these require manual maintenance procedures.
    patchable_vms:
      # REBUILT 2026-10-16 from the live VM list: every Debian/Ubuntu VM Ansible reaches
      # (or reaches in the 23:00-07:00 pve-02 window) that has proxmox_vm_id + proxmox_node.
      # The weekly queue step in scripts/patch_window.sh sets these `pending` in NetBox
      # (netbox_setup_patch_fields.yml --tags reset_pending); patch_never still wins.
      # Removed: media-vm (no longer exists). home-assistant is NOT here on purpose: it has its
      # own Sunday slot (patchable_vms_sunday below); gpu-02 has its own Saturday slot
      # (patchable_vms_gpu02 below). HA is Supervised on Debian 12, not HAOS:
      # Supervisor updates Core/add-ons, the host OS is patched like any other VM.
      # Before this, gpu-01/02, es-01/02, scout-01, osemsearch, grid-01, comms-01 were never in it.
      hosts:
        # pve-01
        dns-01:      {}    # vm 220
        vpn-01:      {}    # vm 210
        pg-01:       {}    # vm 230 -- DB; app connections are re-established by the pg-01 auto-remediation
        web-01:      {}    # vm 240 -- Traefik, Authelia, n8n: every site blips on its reboot
        git-01:      {}    # vm 251 -- Forgejo
        gpu-01:      {}    # vm 270 -- GPU passthrough; rolling_update checks NVIDIA/DKMS after the upgrade
        comms-01:    {}    # vm 271 -- Matrix
        dmz-nc-01:   {}    # vm 200 -- Nextcloud (DMZ)
        dmz-pg-01:   {}    # vm 201 -- Nextcloud DB (DMZ)
        # pve-03
        web-02:      {}    # vm 241 -- Ubuntu noble
        immich-01:   {}    # vm 280
        jellyfin-01: {}    # vm 281
        studio-01:   {}    # vm 283 -- music studio (music-studio stack + Chromatone)
        # pve-01, added 2026-11-05
        code-01:     {}    # vm 252 -- DOMO code partner
        mail-agent-01: {}  # vm 303 -- mail fetcher (mailbox logins live here only)
        # pve-02 -- powered 23:00-07:00 only, so patched in the 05:00 window
        dl-01:       {}    # vm 301
        es-01:       {}    # vm 231
        es-02:       {}    # vm 234
        grid-01:     {}    # vm 302
        scout-01:    {}    # vm 304
        osemsearch:  {}    # vm 106 -- Debian 12 since 2026-10-16 (docs/UPGRADE_OSSEMSEARCH.md); ansible user added the same day
    # Own slot: Sunday 06:00 Europe/Berlin (systemd --user patch-window-ha.timer on the IaC VM),
    # after pve-01's 03:00 vzdump (ends ~05:00-05:10; HA's archive lands ~05:02, so the
    # daily 05:00 window would always fail its backup gate). Queued and patched in the same
    # run; rolling_update.yml skips these hosts unless patch_host names them. 2026-10-23.
    patchable_vms_sunday:
      hosts:
        home-assistant: {}  # vm 282 -- HA Core restarts with Docker; ~1-3 min outage on reboot

    # Own slot: Saturday 05:45 Europe/Berlin (systemd --user patch-window-gpu02.timer on the
    # IaC VM). 2026-11-05: in the daily 05:00 window gpu-02 was patched while pve-03's 03:00
    # vzdump was still running (ends 05:01-05:12); a failed check rolled it back and the
    # restart timed out (10 GB pinned for the GPU), so it stayed down 10-26..10-30 and
    # 11-03..11-05, taking DOMO voice, the classifier, HA speech-to-text and immich-ml with
    # it. 05:45 is after pve-03's vzdump and the daily window, and done before DOMO's 06:30
    # brief. pve-03's vzdump and this timer are both Europe/Berlin, so DST moves them together.
    patchable_vms_gpu02:
      hosts:
        gpu-02: {}  # vm 211 on pve-03 -- Ubuntu noble, GPU passthrough (RTX 2070)

    patchable_always_on:
      hosts:
        dns-01:   {}
        vpn-01:   {}
        pg-01:    {}
        web-01:   {}
        web-02:   {}
        git-01:   {}
        immich-01: {}
        jellyfin-01: {}
        dmz-nc-01: {}
        dmz-pg-01: {}
        home-assistant: {}
        dl-01: {}

    # Subset: WoL-managed VMs (rolling_update.yml will wake before patching)
    patchable_wol_managed:
      hosts:
        media-vm: {}    # pve-03, vm 300
        gpu-02:   {}    # pve-02, vm 211 — RTX 4060 Ti burst node — Ollama+Qwen 14B deployed 2026-07-21


# ============================================================
# GROUP VARIABLES
# ============================================================

# Default variables applied to all groups
group_vars:
  all:
    # Common settings
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: yes
    
    # Vault
    vault_addr: "http://vault.internal:8200"
    vault_skip_verify: false
    
    # DNS
    nameserver_primary: "10.10.30.10"      # Pi-hole on vlan30 (dns-01)
    nameserver_fallback: "8.8.8.8"
    
    # NTP
    ntp_servers:
      - ntp.ubuntu.com
      - time.nist.gov
    
    # Logging
    syslog_server: "graylog-01.internal"
    syslog_port: 5140
    
    # SSH hardening
    ssh_port: 22
    ssh_password_auth: "no"
    ssh_pubkey_auth: "yes"
    
    # Firewall
    ufw_enabled: "yes"
    ufw_default_incoming: "deny"
    ufw_default_outgoing: "allow"

  tier2_storage:
    # Database-specific defaults
    backup_enabled: "yes"
    backup_retention_days: 30
    monitoring_enabled: "yes"
    critical_service: "yes"

  tier3_application:
    # Application-specific defaults
    backup_enabled: "yes"
    backup_retention_days: 14
    monitoring_enabled: "yes"
    critical_service: "no"

  databases:
    # Database role defaults
    postgres_enabled: "yes"
    postgres_backup_type: "wal"
    postgres_replication_enabled: "no"

  docker_hosts:
    # Docker host defaults
    docker_enabled: "yes"
    container_log_driver: "json-file"
    container_log_rotation_enabled: "yes"

  monitoring_exporters:
    # Exporter defaults
    exporter_enabled: "yes"
    prometheus_scrape_interval: "15s"


# ============================================================
# HOST VARIABLES
# ============================================================

host_vars:
  pg-01:
    # PostgreSQL-specific configuration (already defined above)
    pass
  
  web-01:
    # Docker/n8n-specific configuration (already defined above)
    pass
