          # incident_immich_jellyfin_pve-03_reconciliation_2026-09-14.md).
          # proxmox_node fixed here 2026-09-16 after finding this file
          # was the one place still not updated — the stale pve-01 VM
          # (same VMID 281, leftover from before the migration) was
          # deleted the same day; it was still holding a live hostpci0
          # claim on pve-01's own intel-uhd630 mapping that collided with
          # gpu-01's. NOT the older media-vm/pve-03 host_vars entry
          # (media-vm still exists, untouched, still owns tvheadend —
          # this is a separate, deliberate build, not a relocation of
          # that one). See [[project_nasty_nas_migration]] for the
          # Plex-era context.
          ansible_host: 10.10.30.53
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible

          # VM specs — deliberately light; QSV hardware transcoding (Intel
          # UHD 630 iGPU passthrough) does the heavy lifting, not the vCPUs.
          vm_tier: application
          vm_memory_gb: 6
          vm_cpus: 4
          vm_datastore: zfs-nvme
          vm_vlan: vlan30
          proxmox_node: pve-03
          proxmox_vm_id: 281
          health_check_port: 8096
          health_check_url: "http://10.10.30.53:8096/health"

          # Docker
          docker_enabled: "true"
          docker_version: latest
          docker_users:
            - ansible
          compose_dir: /opt/jellyfin

          # ---- Jellyfin application settings ----------------------------------
          jellyfin_version: "12.2"   # 2026-10-16: 10.11.11 -> 12.2 via the patch window container pass (6 advisories, 1 critical). Pinned: a major jump needs its own notes check.
          jellyfin_config_dir: /var/lib/jellyfin/config
          jellyfin_cache_dir: /var/lib/jellyfin/cache
          # Dedicated scratch space for transcode segments — separate small
          # disk (zfs-nvme, fast), not sharing the OS disk. User's own idea
          # 2026-08-13; a tmpfs alternative was discussed too but this is
          # what was asked for — durable, no RAM budget to manage.
          jellyfin_transcode_dir: /var/lib/jellyfin/transcode

          # ---- QSV hardware transcoding (Intel UHD 630 iGPU passthrough) -----
          # Terraform hostpci block references Proxmox resource mapping
          # "intel-uhd630" on pve-03 (0000:00:02.0 / 8086:3e92 — CoffeeLake-S;
          # this is pve-03's iGPU, a different PCI ID than pve-01's, where
          # gpu-01 separately holds its OWN same-named "intel-uhd630"
          # mapping for an unrelated device — no cluster, no shared
          # namespace between hosts). Staged but NOT active yet: needs
          # pve-03's vfio-pci binding live + a pve-03 reboot the user has
          # deferred until the Drive Migration scan finishes — see
          # jellyfin-01/main.tf's hostpci0 comment block for the full
          # sequence. Container needs /dev/dri passed through once it is
          # — see docker-compose.yml.
          jellyfin_qsv_enabled: true

          # ---- Read-only media sources — nas-02 (DATAGRID) over NFSv4.2 --------
          # NASTY (legacy QNAP) has been offline since 2026-09-27; the same host
          # paths are NFS mounts from nas-02 (Roles/jellyfin/tasks/nas_mount.yml):
          # /Multimedia/Videos -> /mnt/nasty-videos, /Multimedia ->
          # /mnt/nasty.multimedia, /DUO -> /mnt/nasty.duo. Path names are
          # historical, kept so container paths + library definitions never change.
          nasty_videos_subpath: "Videos"
          nasty_videos_mount: /mnt/nasty-videos
          # DUO — the ex-QNAP external drive (Kiddo Plex/*, Movies, TVShows,
          # Fit), a separate export, not a Multimedia subfolder. "Kiddo Plex"
          # has a space in it — don't type it as an unquoted shell path anywhere.
          nasty_duo_mount: /mnt/nasty.duo
          # Whole Multimedia share root — overlaps with the Videos-only mount
          # above (Videos is a subfolder of it) but also covers
          # Music/AudioBooks/etc for additional libraries as wanted.
          nasty_multimedia_mount: /mnt/nasty.multimedia

          # Public URL (must match the Traefik route)
          jellyfin_public_domain: "jellyfin.home.example.org"
          jellyfin_url: "https://{{ jellyfin_public_domain }}"

          # Monitoring
          node_exporter_port: 9100
          docker_exporter_port: 9323
          prometheus_scrape_interval: "60s"

          # Backup — config dir only (small, has user accounts/watch state);
          # media originals live on NASTY, own backup posture, out of scope.
          backup_type: restic
          backup_destination: "s3:http://nas-01.internal:9000/restic/jellyfin-01"
          restic_jobs:
            - name: jellyfin-config
              type: files
              paths:
                - /var/lib/jellyfin/config
              schedule: "03:30"
              tags: ["jellyfin", "config"]

          # Tags
          tier: application
          criticality: low
          app_platform: jellyfin
          expose: "true"
          auth: none   # Jellyfin has no native OIDC — mobile/TV/Kodi apps auth directly against its own API; Authelia forward-auth would break them
          sla: low

