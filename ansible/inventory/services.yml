---
# Ansible Inventory - SINGLE SOURCE OF TRUTH
# All VMs and services defined here
# This file is the source, not a generated artifact — scripts/sync_netbox.py
# reads it directly to register/update VMs in NetBox (corrected 2026-08-17;
# the old note here had the relationship backwards).

all:
  ungrouped: {}
  
  children:

    #########################################
    # TIER-0: NETWORK / FIREWALL
    # OPNSense is managed via REST API from the
    # Ansible control node (ansible_connection: local).
    # fw-01 never receives a direct SSH connection.
    #########################################
    firewall:
      hosts:
        fw-01:
          ansible_host: 10.10.0.1           # Current IP (pre-VLAN migration). Target: 10.10.10.1 after VLAN10 is configured.
          ansible_connection: local         # All tasks use uri module → OPNSense REST API
          opnsense_host: 10.10.0.1
          opnsense_api_port: 443
          proxmox_node: pve-01
          proxmox_vm_id: 100
          vm_vlan: vlan10
          tier: network
          criticality: critical
          service: opnsense
          vault_opnsense_path: secret/homelab/opnsense

    #########################################
    # TIER-0b: MANAGEMENT / CONTROL PLANE
    # The IaC VM itself -- runs Vault + iac-api + this whole Ansible
    # control node. Added 2026-09-13: this host was NEVER in inventory at
    # all (only present as Pi-hole DNS records for vault.internal/
    # iac.internal) -- the classic "control machine manages everything
    # except itself" gap. Real consequence: zero Prometheus/node_exporter
    # coverage on the one host running Vault and iac-api, which is why a
    # multi-day iac-api outage went completely undetected (see
    # incident_iac_api_n8n_cascade_2026-09-13 memory). ansible_connection:
    # local, same pattern as fw-01 above -- this machine manages itself,
    # no SSH hop needed.
    #########################################
    management:
      hosts:
        iac-vm:
          # Real Proxmox identity confirmed live 2026-09-13 (user provided,
          # verified against the real API): named "Netsible" in Proxmox
          # itself, VM 103 on pve-01. Corrects IaC/CLAUDE.md's own Node Map,
          # which listed this host as "bare-metal" -- it's a real Proxmox
          # VM like everything else, just never tracked as one anywhere.
          # Inventory key stays "iac-vm" (not renamed to "Netsible") to
          # match the SSH config alias / doc references already using that
          # name for this same machine (macbook_bootstrap.sh, IAC_ORCHESTRATION
          # docs) -- this comment is the cross-reference.
          ansible_host: 10.10.0.15
          ansible_connection: local
          proxmox_node: pve-01
          proxmox_vm_id: 103
          vm_tier: management
          criticality: critical
          service: iac-api
          tier: management

    #########################################
    # TIER-1: CORE INFRASTRUCTURE
    #########################################
    tier1_core:
      hosts:
        dns-01:
          ansible_host: 10.10.30.10
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          # Bootstrap proxy: route via Proxmox until OPNSense has VLAN30 routing.
          # Remove after: opnsense role configures vtnet0 VLAN30 interface + fw rules.
          ansible_ssh_common_args: >-
            -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_ansible
            -o StrictHostKeyChecking=no root@10.10.0.11"
            -o StrictHostKeyChecking=no
          vm_tier: core
          vm_vlan: vlan30
          proxmox_node: pve-01
          proxmox_vm_id: 220
          health_check_port: 80        # Pihole web UI
          health_check_url: "http://10.10.30.10/admin/"
          docker_enabled: "true"
          docker_compose_dirs:
            - /opt/pihole
          pihole_web_port: 80
          pihole_dns_port: 53
          vault_pihole_path: secret/pihole/api
          tier: core
          criticality: critical
          service: pihole
          # Internal DNS overrides — home.example.org services resolve to web-01
          # Pi-hole intercepts these before they hit public DNS.
          pihole_dns_records:
            # Legacy .internal records (needed by Ansible/Terraform/services)
            - { ip: "10.10.0.15",  name: "vault.internal" }
            - { ip: "10.10.0.15",  name: "iac.internal" }
            # home.example.org services → web-01 (Traefik)
            - { ip: "10.10.30.20", name: "auth.home.example.org" }
            - { ip: "10.10.30.20", name: "home.home.example.org" }
            - { ip: "10.10.30.20", name: "traefik.home.example.org" }
            - { ip: "10.10.30.20", name: "n8n.home.example.org" }
            - { ip: "10.10.30.20", name: "grafana.home.example.org" }
            - { ip: "10.10.30.20", name: "netbox.home.example.org" }
            - { ip: "10.10.30.20", name: "git.home.example.org" }
            - { ip: "10.10.30.20", name: "wiki.home.example.org" }
            - { ip: "10.10.30.20", name: "jira.home.example.org" }
            - { ip: "10.10.30.20", name: "photos.home.example.org" }
            - { ip: "10.10.30.20", name: "vpn.home.example.org" }
            - { ip: "10.10.30.20", name: "chat.home.example.org" }
            - { ip: "10.10.30.20", name: "media.home.example.org" }
            - { ip: "10.10.30.20", name: "recipes.home.example.org" }
            - { ip: "10.10.30.20", name: "outline.home.example.org" }
            - { ip: "10.10.30.20", name: "travel.home.example.org" }
            - { ip: "10.10.30.20", name: "hike.home.example.org" }
            - { ip: "10.10.0.15",  name: "vault.home.example.org" }
            - { ip: "10.10.30.10", name: "pihole.home.example.org" }

        vpn-01:
          ansible_host: 10.10.10.5
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          vm_tier: core
          vm_vlan: vlan10
          proxmox_node: pve-01
          proxmox_vm_id: 210
          health_check_port: 22         # SSH — WireGuard is UDP, not TCP-checkable
          docker_enabled: "false"
          wireguard_public_endpoint: "vpn.home.example.org"
          wireguard_port: 51820
          wg_easy_port: 51821
          vault_wg_path: secret/vpn/wireguard
          vault_wg_easy_path: secret/vpn/wg-easy
          tier: core
          criticality: high
          service: wireguard

    #########################################
    # TIER-0: PROXMOX HYPERVISORS
    #########################################
    proxmox_hosts:
      hosts:
        pve-01:
          ansible_host: 10.10.0.11    # Current: client VLAN. Will move to 10.10.10.11 (MGMT VLAN10) later.
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          proxmox_node: pve-01
          always_on: true
          nic_10g: true
          role: primary
        pve-02:
          ansible_host: 10.10.0.12
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          proxmox_node: pve-02
          always_on: false            # WoL-managed — not kept running
          wol_enabled: true
          wol_mac: ""                 # auto-populated by wol_setup.yml → host_vars/pve-02.yml
          wol_broadcast: "10.10.0.255"
        pve-03:
          ansible_host: 10.10.0.13
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          proxmox_node: pve-03          # real Proxmox node name — see IaC/CLAUDE.md
          always_on: false            # WoL-managed — not kept running
          wol_enabled: true
          wol_mac: ""                 # auto-populated by wol_setup.yml → host_vars/pve-03.yml
          wol_broadcast: "10.10.0.255"
          comment: >-
            Dedicated media host. Kept powered off when idle.
            Wake-on-LAN before media-vm start.

    # Alias groups for playbook targeting
    proxmox_primary:
      hosts:
        pve-01:

    proxmox_burst:
      hosts:
        pve-02:
        pve-03:

    pve_wol_hosts:
      hosts:
        pve-02:
        pve-03:

    #########################################
    # NAS — OpenMediaVault (both are VMs, not bare-metal — group name is a
    # stale holdover from before that was corrected, see nas-01's own note
    # below; left as-is to avoid an unrelated rename mid-build)
    #########################################
    nas:
      hosts:
        nas-01:
          ansible_host: 10.10.40.20
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_python_interpreter: /usr/bin/python3
          # OpenMediaVault — VM 232 on pve-01, NOT bare-metal (corrected
          # 2026-08-10, see project_omv7_rpc_quirks memory). proxmox_vm_id
          # was documented in IaC/CLAUDE.md's Node Map but never actually
          # added here — found + fixed 2026-08-17 while wiring NetBox sync
          # to read this file directly.
          proxmox_node: pve-01
          proxmox_vm_id: 232
        nas-02:
          # Added 2026-09-19 — OpenMediaVault #2, on pve-03, built via
          # IaC/Terraform/envs/nas-02/ (VM 233), matching nas-01's exact
          # shape (raw disk passthrough, ZFS mirror built inside the guest).
          # See project_nas02_zfs_storage_architecture memory.
          ansible_host: 10.10.40.21
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_python_interpreter: /usr/bin/python3
          proxmox_node: pve-03
          proxmox_vm_id: 233
          # ---- Backrest (restic web UI, browse/restore only) — added 2026-09-27 ----
          # Role: Roles/backrest, playbook: deploy_backrest.yml, plan: docs/BACKREST_DEPLOYMENT.md.
          # Listens on the storage-VLAN IP; only web-01 (Traefik) may reach :9898 (fw rule, tag backrest).
          # Repos are reached via rest-server --append-only on VLAN 399, never the local path.
          backrest_listen: "10.10.40.21:9898"
          backrest_repos:
            - id: timemachine          # BKP-TM dock drive (pve-03) — offline most of the time
              uri: "rest:http://172.31.98.2:8000/timemachine/"
              vault_path: restic/timemachine
            - id: datagrid             # BKP-DATAGRID dock drive (pve-03) — offline most of the time; rest-server-datagrid :8001
              uri: "rest:http://172.31.98.2:8001/datagrid/"
              vault_path: restic/datagrid
            - id: duo                  # BKP-DUO dock drive (pve-03) — offline most of the time; rest-server-duo :8002
              uri: "rest:http://172.31.98.2:8002/duo/"
              vault_path: restic/duo

    #########################################
    # EXTERNAL / CLOUD — first non-Proxmox host in inventory.
    # Public IONOS VPS, WireGuard front-door relay for vpn-01.
    # No proxmox_node/proxmox_vm_id — provisioned manually (IONOS Cloud API
    # token blocked on account access, see project_ionos_vps_wireguard_frontdoor
    # memory), not via the ionos-vps Terraform env. OS is Ubuntu 24.04 LTS,
    # not Debian 12 like the rest of the fleet — watch for Debian-only role
    # assumptions (bit gpu-02 before).
    #########################################
    ionos_vps:
      hosts:
        ionos-vps-01:
          ansible_host: 203.0.113.10
          ansible_user: ansible   # dedicated sudo user created 2026-08-06, verified working; root SSH being locked down in F2
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_python_interpreter: /usr/bin/python3

    #########################################
    # IOT SENSORS — bare-metal Raspberry Pi hardware on VLAN20, NOT Proxmox
    # VMs (no proxmox_node/proxmox_vm_id, same reason as ionos_vps above).
    # Distinct from the remote-HA Pis (10.10.20.24 etc) - those run their own
    # full HAOS Supervisor and are managed via `ha` CLI over SSH directly,
    # never through Ansible. Hosts here are plain Debian and Ansible-managed
    # like any other fleet member.
    #########################################
    iot_sensors:
      hosts:
        photosensor-pi:
          # SunFounder-kit photoresistor doorbell-light sensor build, see
          # project_doorbell_detector memory (2026-09-11 architecture
          # correction: doorcam itself can't host physical sensors, so this
          # lives inside near the apartment door instead). Bootstrapped
          # 2026-09-12: fresh Raspberry Pi OS (Debian 13 "trixie", 64-bit),
          # Pi 3 B, bootstrap creds were a one-time PI3_USER/PI3_PASSWORD in
          # /opt/vault/.env, now retired -- see secret/pi3-photosensor/ssh
          # for the still-needed bootstrap creds if this Pi is ever re-imaged.
          ansible_host: 10.10.20.91
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_python_interpreter: /usr/bin/python3
          vm_vlan: vlan20
          tier: iot

    #########################################
    # TIER-2: STORAGE & COMPUTE
    #########################################
    tier2_storage:
      hosts:
        pg-01:
          # FROM: config/vms/pg-01.yaml
          ansible_host: 10.10.40.10
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          
          # VM specs
          vm_tier: storage
          vm_memory_gb: 4
          vm_cpus: 2
          vm_datastore: postgres
          vm_vlan: vlan40
          proxmox_node: pve-01
          proxmox_vm_id: 230
          health_check_port: 5432     # PostgreSQL
          docker_enabled: "false"
          
          # PostgreSQL configuration
          postgres_version: 15
          postgres_port: 5432
          postgres_data_dir: /var/lib/postgresql/15/main
          postgres_wal_dir: /wal/pg_wal   # STALE for pg-01: real WAL is /var/lib/postgresql/wal (sda), pg_wal symlinked; only deploy_dmz_pg.yml uses this var
          
          # Performance tuning
          postgres_max_connections: 200
          postgres_shared_buffers: "1GB"
          postgres_effective_cache_size: "2GB"

          # 2026-10-23 tuning, all reload-only (applied live with pg_reload_conf,
          # no restart). Baseline: 462 GB WAL since 07-07, mostly full-page
          # images; 29% of buffer writes done by backends; Immich 119 GB of temp
          # spills at work_mem=4MB. WAL disk (/dev/sda, 20 GB) has 18 GB free.
          postgres_checkpoint_timeout: "15min"
          postgres_max_wal_size: "4GB"
          postgres_min_wal_size: "1GB"
          postgres_wal_compression: "lz4"
          postgres_bgwriter_lru_maxpages: 1000
          postgres_bgwriter_lru_multiplier: 4.0
          postgres_log_temp_files: "10MB"
          postgres_track_io_timing: "on"
          postgres_database_settings:
            - {database: immich, name: work_mem, value: "32MB"}

          # Extensions brought up to the newly installed package version after
          # every patch run (rolling_update.yml Phase 3g), in every database that
          # has them. 2026-10-19: the patch window took pgvector 0.8.6 -> 0.8.7;
          # Immich then tried ALTER EXTENSION vector UPDATE itself as the non-owner
          # immich user and crash-looped 03:34-06:14 UTC.
          postgres_post_patch_extensions:
            - vector

          # 2026-10-22: after pg-01 itself is patched, rolling_update.yml restarts every app with a
          # pg-01 connection pool (playbooks/restart_pg01_dependents.yml), waits for NetBox's API
          # (its DB lives here) and only then writes patch_status. On 2026-10-19 the write came 27 s
          # after the Postgres restart, got a 500, and pg-01 stayed in_progress although it was fine.
          patch_restart_pg_dependents: true

          # WAL Configuration
          postgres_wal_level: replica
          postgres_max_wal_senders: 3
          postgres_wal_keep_size: "500MB"
          # "off" since 2026-10-23, matching what actually ran: pgBackRest was
          # designed (docs/PG-01_DEPLOYMENT_GUIDE.md, MinIO on nas-01) but never
          # installed, so archive_command 'pgbackrest archive-push' failed for
          # every segment, WAL piled up and filled the disk on 2026-09-02; that
          # day someone set ALTER SYSTEM archive_mode=off and moved pg_wal to its
          # own disk. The ALTER SYSTEM override was RESET on 2026-10-23 so file and
          # running state agree (no restart: effective value stayed off).
          # Turning this on needs a working archive target AND a restart.
          # 2026-10-23: pgBackRest built for real (Roles/postgres/tasks/pgbackrest.yml,
          # repo on nas-01 ETBs/backups/pgbackrest via NFS, async archiving with a
          # 4 GiB queue cap so an unreachable repo can't fill the WAL disk again).
          # archive_mode=on takes effect at the restart in the 2026-10-23 18:30 UTC
          # maintenance window.
          postgres_archive_mode: "on"
          postgres_archive_command: "pgbackrest --stanza=pg-01 archive-push %p"
          postgres_archive_timeout: "15min"   # worst-case loss on a quiet DB
          postgres_pgbackrest_enabled: true
          postgres_pgbackrest_stanza: pg-01
          postgres_pgbackrest_nfs_source: "10.10.40.20:/backups/pgbackrest"   # nas-01 ETBs/backups/pgbackrest (uid 104:110)
          # pgBackRest covers every day (+ PITR), so the logical dump is a weekly
          # extra copy in plain SQL (2026-10-23, after the first verified full backup).
          postgres_simple_backup_weekday: "0"
          postgres_simple_backup_keep_days: 28
          
          # Backup
          pgbackrest_enabled: true   # NOT USED by any role/playbook (2026-10-23); pgBackRest was never installed
          pgbackrest_stanza: "pg-01"
          pgbackrest_repo_type: "s3"
          pgbackrest_repo_s3_endpoint: "nas-01.internal:9000"
          pgbackrest_repo_s3_bucket: "postgres-backups"
          
          # Vault references
          vault_postgres_path: secret/postgres/pg-01
          vault_postgres_password: secret/postgres/pg-01/postgres_password
          vault_replication_password: secret/postgres/pg-01/replication_user_password
          vault_backup_s3_key: secret/postgres/pg-01/backup_s3_key
          vault_backup_s3_secret: secret/postgres/pg-01/backup_s3_secret

          # Restic backup
          restic_jobs:
            - name: postgres-dumps
              type: postgres
              pg_host: localhost
              pg_user: postgres
              pg_port: 5432
              databases: all          # pg_dump every non-template DB, piped to restic stdin
              schedule: "01:00"
            - name: configs
              type: files
              paths:
                - /etc/postgresql
                - /etc/pgbackrest
              schedule: "01:15"
          
          # Monitoring
          postgres_exporter_port: 9187
          prometheus_scrape_interval: "15s"
          
          # Tags (for filtering)
          tier: storage
          criticality: critical
          postgres_role: primary
          wal_enabled: "true"
          backup_strategy: wal-archiving
    
    
    #########################################
    # TIER-3: COMPUTE (GPU / LLM / ML)
    #########################################
    tier3_compute:
      hosts:
        gpu-01:
          # FROM: config/vms/gpu-01.yaml
          # Always-on LLM inference — now RTX 4060 Ti 16GB on pve-01
          # as of the 2026-09-19 GPU host migration (was RTX 2070 8GB —
          # see project_gpu_host_migration_2026-09-18 memory); this VM
          # itself never moved hosts, only the physical card changed.
          ansible_host: 10.10.30.50
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ansible

          # Added 2026-09-19 while fixing a real bug: whisper.yml's env
          # vars were silently ignored (wrong var name, see that file's
          # header) so this VM has actually been running the container
          # image's own baked-in default (Systran/faster-whisper-large-v3)
          # this whole time, not the "small" model previously intended.
          # Documenting that REAL behavior explicitly here rather than
          # letting the bugfix silently change it to the role's new
          # "small" default on next deploy.
          whisper_enabled: true
          whisper_model: "Systran/faster-whisper-large-v3"

          # VM specs
          vm_tier: compute
          vm_memory_gb: 64
          vm_cpus: 16
          vm_datastore: zfs-nvme
          vm_vlan: vlan30
          proxmox_node: pve-01
          proxmox_vm_id: 270
          always_on: true

          # rolling_update.yml wiring
          health_check_port: 11434              # Ollama
          health_check_url: "http://10.10.30.50:8080/health"  # open-webui (host network, listens on 8080 not open_webui_port)
          docker_enabled: "true"
          gpu_passthrough: true
          gpu_docker_containers:
            - whisper
            - immich-ml
            - open-webui

          # Added 2026-09-16 -- was NOT set anywhere in inventory despite
          # admin's OpenClaw instance being live for days; the original
          # deploy must have used an undocumented `-e openclaw_enabled=true`
          # CLI flag. Found the hard way while restoring his gateway after
          # the container_name collision incident (see
          # project_dual_llm_fable_review memory) -- a plain `--tags
          # openclaw` redeploy silently skipped all 22 tasks with this
          # flag unset. Persisting it here so this can't bite again.
          openclaw_enabled: true

          # scout-mcp, added 2026-09-20 -- the only channel between
          # Concierge and Scout (isolated research agent, own VM on pve-02).
          # Persisted here from day one, not left to an undocumented CLI
          # flag -- exactly the gap that bit openclaw_enabled above.
          scout_mcp_enabled: true

          # Partner's OpenClaw gateway MOVED here from gpu-02 2026-09-16 (see
          # project_dual_llm_fable_review memory) — gpu-02 hosting her whole
          # gateway was a real single point of failure: her account had NO
          # working fallback at all when gpu-02 slept, since the gateway
          # process needed to even evaluate the gpu01-ollama fallback didn't
          # exist on a powered-off VM. Only her MODEL stays on gpu-02 now
          # (unchanged primary/fallback config in her openclaw.json) — same
          # decoupled shape admin's instance already had. Distinct ports from
          # admin's instance (18789/18790) since both gateways now share this
          # host: 18791/18792.
          partner_concierge_enabled: true
          partner_gateway_port: 18791
          partner_bridge_port: 18792

          # jev-router (2026-09-28): classifies with the local gpu01-primary LLM
          # (same model as Concierge, already resident -- no extra VRAM, no
          # reload). Self-hosted jeff was tried first and removed the same day
          # (33-54% vs 98%, see project_jeff_evaluation memory). Nothing calls it
          # until the HA custom_component is installed.
          jev_router_enabled: false   # 2026-10-20 (user): stopped -- never cut over (0 production calls since 2026-09-28; HA voice routes via n8n). Code + image kept; set true + run the gpu role to redeploy.
          jev_backend: "ollama"


          # NVIDIA
          nvidia_driver_version: "535"
          nvidia_cuda_version: "12-3"
          nvidia_persistence_mode: true
          nvidia_power_limit_watts: 160  # 175W TDP → 160W
          nvidia_gpu_clocks_enabled: false
          nvidia_graphics_clock: 0
          nvidia_memory_clock: 0

          # Ollama tuning (RTX 2070 / 8 GB VRAM)
          ollama_port: 11434
          ollama_num_parallel: 2
          ollama_max_loaded_models: 2
          ollama_flash_attention: true
          # Raised 5m -> 20m 2026-08-14 — root-caused the HA voice pipeline's
          # ~5s latency to repeated cold model loads (load_duration ~2.5s per
          # call, paid twice per interaction across the classify+respond
          # calls). GPU confirmed idle otherwise (YOLO/Frigate not currently
          # running, immich-ml candidate for off-hours scheduling) so the
          # longer VRAM reservation is low-risk today. Watch for: two models
          # resident at once (qwen2.5:7b + qwen2.5-coder:7b, ~4.68GB each)
          # would be ~9.4GB combined if both get used within a 20m window —
          # over this card's 8GB VRAM. See project_home_assistant memory.
          # -1 = never unload (2026-10-09). The 20m timeout plus 3 models
          # competing for 2 slots reloaded gpu01-primary 10x in 6 h, so Echo/Serge/HA
          # often waited 10-25 s for it. The qwen2.5:7b callers moved to gpu-02, so
          # only gpu01-primary + nomic-embed-text live here now.
          ollama_keep_alive: "-1"
          ollama_num_gpu: "999"
          ollama_models_dir: /var/lib/ollama/models
