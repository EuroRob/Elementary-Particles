        gpu-02:
          # FROM: config/vms/gpu-02.yaml
          # Burst LLM node — now RTX 2070 8GB on pve-03 as of the
          # 2026-09-19 GPU host migration (was RTX 4060 Ti 16GB on pve-02/
          # pve-02 — see project_gpu_host_migration_2026-09-18 memory).
          # This VM's whole disk moved hosts via nas-01 backup/restore,
          # unlike gpu-01 which stayed put and just got a card swap.
          ansible_host: 10.10.30.51
          ansible_user: deploy   # cloud-init user_account.username is "deploy", not "ansible" (see Terraform/envs/gpu-02/main.tf)
          ansible_ssh_private_key_file: ~/.ssh/id_ansible

          # Docker configuration — "deploy" is the actual cloud-init user (no "ansible" user exists on gpu-02)
          docker_users:
            - deploy

          # VM specs
          vm_tier: compute
          # Was "32" -- already stale/inaccurate before today (real live
          # memory was 20GB, not 32). Now genuinely 12GB (2026-09-19,
          # dropped from 20GB now that the 3B model + whisper fit
          # comfortably, see the Ollama section below) -- fixed to match
          # reality rather than carry the drift forward.
          vm_memory_gb: 12
          vm_cpus: 8
          vm_datastore: local-lvm
          vm_vlan: vlan30
          # FIXED 2026-09-19: was "pve-02" -- already flagged as wrong in
          # IaC/CLAUDE.md's Active Constraints before today (should have
          # been "pve-02"), now doubly wrong since this VM actually moved
          # to pve-03 in the GPU host migration. "pve-03" is both the correct
          # fix and the current physical reality.
          proxmox_node: pve-03
          # Was previously only in a comment on the patchable_wol_managed group
          # entry ("gpu-02: {} # pve-02, vm 211") — never an actual field here.
          # Found + fixed 2026-08-17 alongside the same nas-01 gap.
          proxmox_vm_id: 211
          always_on: false

          # rolling_update.yml wiring — gpu-02 is WoL/burst (usually powered off), so it's
          # NOT included in the scheduled weekly patch cycle for now (that would need WoL
          # orchestration first). gpu_passthrough is set so a manual/limit-scoped run against
          # it still gets the nvidia-smi/DKMS validation phase.
          gpu_passthrough: true
          # Corrected 2026-09-12: was "false" ("Ollama runs as a native
          # systemd service here, not Docker") -- true for Ollama, but
          # Docker itself was found ALREADY installed and working live
          # (--gpus all confirmed) when deploying diarization-api here.
          # Unclear when/how it got installed outside this role's own
          # tracking -- flagging the gap rather than pretending it isn't
          # there.
          docker_enabled: "true"
          diarization_api_enabled: true   # podcast speaker diarization — see Roles/gpu/tasks/diarization_api.yml
          domo_gateway_enabled: true      # DOMO voice gateway (2026-10-09) — see Roles/gpu/tasks/domo_gateway.yml
          wyoming_bridge_enabled: true    # HA speech-to-text via this Whisper (2026-10-30) — see Roles/gpu/tasks/wyoming_bridge.yml
          stem_api_enabled: true          # Demucs vocals for Musician Platform draft lead sheets — Roles/gpu/tasks/stem_api.yml
          # jeff DISABLED + removed 2026-09-28 after evaluation: 33-54% on voice
          # routing (vs 98% for gpu01-primary) and ~coin-flip on prompt-injection
          # detection -- not fit for either role; see project_jeff_evaluation
          # memory. Code kept in Roles/gpu/tasks/jeff.yml for a future model.
          jeff_enabled: false
          # Measured 2026-09-28: 3.43 GiB peak during model load, 3.12 GiB steady,
          # 2.7 GB VRAM. The first deploy's 3g cap OOM-killed it mid-load.
          jeff_memory: "4g"
          # partner_concierge_enabled MOVED to gpu-01 2026-09-16 — see that
          # host's entry below and incident/decision write-up in
          # project_dual_llm_fable_review memory. gpu-02 hosting her whole
          # gateway was a real single point of failure: when this VM sleeps,
          # the gateway process that would even EVALUATE the gpu01-ollama
          # fallback doesn't exist to run it. Only her model stays here now.

          # NVIDIA -- was tuned for Ada Lovelace SM 8.9 (needs 545+) when
          # this was the 4060 Ti; now Turing (the 2070, same architecture
          # gpu-01 ran for years). 545/12-3 still work fine on Turing, not
          # changed, but the "needs 545+" reasoning no longer applies to
          # this specific card.
          nvidia_driver_version: "545"
          nvidia_cuda_version: "12-3"
          nvidia_persistence_mode: true
          nvidia_power_limit_watts: 0
          nvidia_gpu_clocks_enabled: false
          nvidia_graphics_clock: 0
          nvidia_memory_clock: 0

          # Ollama tuning (RTX 2070 / 8GB VRAM as of 2026-09-19 -- was
          # RTX 4060 Ti / 16GB). The old 14B models (~9GB each) do not
          # fit at all anymore -- confirmed live, nvidia-smi shows the
          # full 8192MiB free. Dropped to a single 3B model per Fable's
          # recommendation, leaving comfortable headroom alongside
          # faster-whisper (large-v3-turbo, ~1.5-2.5GB) running on the
          # same card -- see the whisper_* vars below and
          # project_gpu_host_migration_2026-09-18 memory's Whisper/
          # triage-model spec section.
          ollama_port: 11434
          # 2 since 2026-10-09: background qwen2.5:7b jobs (podcast, journal, ...)
          # moved here, and DOMO routing must never queue behind one of them.
          ollama_num_parallel: 2
          # One shared copy of qwen2.5:7b: callers that don't send num_ctx get
          # 4096, and DOMO's router asks for 4096 too (MAX_LOADED_MODELS is 1).
          ollama_context_length: 4096
          ollama_max_loaded_models: 1
          ollama_flash_attention: true
          ollama_keep_alive: "10m"        # keep model warm longer — reload is slow
          ollama_num_gpu: "999"
          ollama_models_dir: /var/lib/ollama/models
          ollama_models:
            - "qwen2.5:3b-instruct-q4_K_M"
          ollama_embed_model: "nomic-embed-text:latest"
          ollama_always_pull_embed: true

          # Podcast-backlog transcription with GPU acceleration -- added
          # 2026-09-19, moved here from gpu-01's CPU-only fallback now
          # that this host has real spare VRAM alongside its 3B model.
          # See whisper.yml's header for the env-var bug this also fixed.
          whisper_enabled: true
          whisper_device: cuda
          whisper_compute_type: float16
          whisper_model: "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
          # 10GB VM: cap whisper so a long episode OOMs only its own container
          # (2 global OOM kills on gpu-02, 2026-09-23 + 09-28; applied live via docker update).
          whisper_memory: "7g"

          # Services — gpu-02 is headless inference only
          open_webui_enabled: false
          # immich-ml moved here from gpu-01 2026-09-28: pve-03 has far less CPU load, immich-01
          # lives on pve-03 too, and it's the CPU image (no VRAM contention with ollama/whisper).
          # Capped because this VM is 10GB (whisper 7g cap shares it).
          immich_ml_enabled: true
          immich_ml_memory: "3g"
          yolo_enabled: false

          # Vault
          vault_gpu_path: secret/gpu/ollama
          vault_pihole_api_token_path: secret/pihole/api

          # Monitoring
          nvidia_exporter_port: 9835
          node_exporter_port: 9100

          # Tags
          tier: compute
          criticality: medium
          gpu: "RTX 4060 Ti 16GB"
          driver: "545"
          burst_capable: "true"
          idle_shutdown_minutes: 30

