          # incident_pve-03_memory_rebalance_2026-09-28). The 5 GB here and the 6 GB of the old
          # download-vm branch were both stale (reconciled 2026-10-17). sync_netbox.py rounds GB*1024.
          # 2026-10-22: 3 GB live (5 GB 10-18..10-22 for the iOS ingest + v3.3.4 backlog) -- see Terraform tfvars.
          # 2026-11-05: 2.5 GB live (no more bulk uploads; ~1.3 GB used), so pve-03 runs gpu-02 too. sync_netbox.py rounds GB*1024.
          vm_memory_gb: 2.5
          vm_cpus: 4
          vm_datastore: zfs-nvme      # real pool name (see Terraform/CLAUDE.md) — was "zfs-nvme-vms", didn't exist
          vm_vlan: vlan30
          # Migrated pve-01->pve-03 ad hoc 2026-09-13 (real, live, serving
          # traffic before Terraform/inventory knew about it — Terraform
          # reconciled 2026-09-14, see
          # incident_immich_jellyfin_pve-03_reconciliation_2026-09-14.md;
          # this file fixed 2026-09-16, same gap as jellyfin-01 — see
          # incident_jellyfin01_hostpci_conflict_2026-09-16.md). The old
          # "everything stays on one hypervisor" reasoning below no
          # longer holds — ML still runs on gpu-01 (pve-01), immich-01
          # itself is now on pve-03. The stale pre-migration pve-01 VM
          # (same VMID 280) was deleted 2026-09-16.
          proxmox_node: pve-03
          proxmox_vm_id: 280     # 271 taken by comms-01; next free in the 21x/24x/27x service-VM sequence
          health_check_port: 2283     # Immich API
          health_check_url: "http://10.10.30.46:2283/api/server/ping"

          # Docker
          docker_enabled: "true"
          docker_version: latest
          docker_users:
            - ansible
          compose_dir: /opt/immich

          # ---- Immich application settings -----------------------------------
          # immich_version: pinned ONCE in inventory/group_vars/all.yml (shared with immich-ml on gpu-02), not here
          # Thumbnails/encoded-video cache: local NVMe (fast, fully reproducible from originals)
          immich_cache_dir: /var/lib/immich/cache
          # Upload location for new assets (mobile backup etc) — moved to NASTY
          # 2026-08-15 (architecture decision: NASTY is the source of truth, so
          # new uploads should land there directly, not on local disk needing a
          # later migration step). Read-write mount, separate from the
          # read-only Pictures/Videos External Library mounts — see
          # Roles/immich/tasks/nas_mount.yml. The old local path
          # (/var/lib/immich/upload) is no longer used by the running
          # container; its ~18MB of prior content was copied over already.
          immich_upload_dir: /mnt/nasty-immich-uploads

          # ---- PostgreSQL — pg-01 (NOT bundled) -------------------------------
          # pg-01 already runs Postgres 15 for every other app. Immich needs the
          # `pgvector` extension (PGDG-packaged: postgresql-15-pgvector) enabled
          # ONLY on the immich database — see deploy_immich.yml. pg-01's existing
          # nightly pg_dumpall (Roles/postgres/tasks/backup.yml) covers this DB
          # automatically; no per-app Restic job needed.
          immich_db_host: "10.10.40.10"
          immich_db_port: 5432
          immich_db_name: immich

          # ---- Machine Learning — gpu-02 (NOT bundled) ------------------------
          # immich-ml runs on gpu-02 (Roles/gpu/tasks/immich_ml.yml, immich_ml_enabled
          # on gpu-02) since 2026-09-28; was gpu-01 before. Same host (pve-03) as immich-01.
          immich_ml_url: "http://10.10.30.51:3003"

          # ---- NASTY (legacy SMB NAS) — External Library source ----------------
          # 2TB+ existing library — pointed at directly (no import) per user
          # decision 2026-08-09. Read-only mounts; Immich's own External
          # Libraries feature scans these without taking ownership of the
          # files. When NASTY is eventually retired, repoint these two mounts
          # at nas-01's pictures/video NFS exports (host_vars/nas-01.yml
          # already has them ready) — nothing else in this config should need
          # to change.
          #
          # nasty.internal (Pi-hole, added 2026-08-10) resolves to 10.10.40.30 —
          # NASTY's real, live VLAN40 address. Cutover completed 2026-08-11
          # (was previously reserved-but-not-live; corrected 2026-08-17 — see
          # [[project_nasty_nas_migration]]). deploy_immich.yml has already
          # been run successfully against this address; Immich is in
          # production use of this mount.
          # Videos deliberately excluded (removed 2026-08-16): NASTY's Videos
          # share is a 751GB general media collection (documentaries/music
          # videos/downloaded clips — only "Home", 357GB, was genuine
          # personal video), not something a personal photo app should own.
          # Immich's transcode policy re-encoded nearly all of it on first
          # scan and filled the OS root disk within a day (see
          # immich_cache_dir below + Terraform immich01_cache_disk_size for
          # the disk-isolation half of the fix). That content is Jellyfin's
          # job now — see [[project_jellyfin_deployment]].
          # Source is nas-02 NFS since 2026-09-28 (NASTY retired) — the
          # "nasty" names/paths are historical, see Roles/immich/tasks/nas_mount.yml.
          nasty_pictures_subpath: "Pictures"
          nasty_pictures_mount: /mnt/nasty-pictures

          # Vault paths
          vault_immich_app_path: secret/immich/app     # key: jwt_secret
          vault_immich_db_path: secret/immich/db       # keys: user, password
          vault_immich_oidc_path: secret/authelia/oidc.immich_secret

          # Monitoring
          node_exporter_port: 9100
          docker_exporter_port: 9323
          prometheus_scrape_interval: "60s"
