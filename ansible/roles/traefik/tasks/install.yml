---
# =============================================================================
# Role: traefik — install.yml
# Prepare host, pull certs from Vault, deploy Traefik container.
# =============================================================================

- name: "[traefik] Create directory structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"
    - "{{ traefik_certs_dir }}"
    - "{{ traefik_log_dir }}"
    - "{{ traefik_compose_dir }}"

# ---- Pull TLS certs from Vault -----------------------------------------------
- name: "[traefik] Fetch TLS wildcard cert from Vault"
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: token
    token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    path: "{{ vault_traefik_certs_path | regex_replace('^secret/', '') }}"
    engine_mount_point: secret
  register: vault_certs
  delegate_to: localhost
  become: false
  no_log: true

- name: "[traefik] Write wildcard.internal.crt"
  ansible.builtin.copy:
    dest: "{{ traefik_certs_dir }}/wildcard.internal.crt"
    content: "{{ vault_certs.secret.wildcard_crt }}"
    mode: "0644"
  no_log: true

- name: "[traefik] Write wildcard.internal.key"
  ansible.builtin.copy:
    dest: "{{ traefik_certs_dir }}/wildcard.internal.key"
    content: "{{ vault_certs.secret.wildcard_key }}"
    mode: "0600"
  no_log: true

# ---- ACME (Let's Encrypt via IONOS DNS-01) — conditional -------------------
- name: "[traefik] Create ACME storage directory"
  ansible.builtin.file:
    path: "{{ traefik_acme_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: traefik_acme_enabled | bool

- name: "[traefik] Create acme.json with correct permissions"
  ansible.builtin.file:
    path: "{{ traefik_acme_dir }}/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve   # don't reset mtime on re-runs (file may contain live certs)
    access_time: preserve
  when: traefik_acme_enabled | bool

- name: "[traefik] Fetch IONOS API key from Vault"
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: token
    token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    path: "{{ vault_traefik_acme_path | regex_replace('^secret/', '') }}"
    engine_mount_point: secret
  register: vault_acme
  delegate_to: localhost
  become: false
  no_log: true
  when: traefik_acme_enabled | bool

- name: "[traefik] Write .env file with IONOS API key"
  ansible.builtin.copy:
    dest: "{{ traefik_compose_dir }}/.env"
    content: |
      # Auto-generated by Ansible — do not hand-edit.
      # Key sourced from Vault: {{ vault_traefik_acme_path }}  →  ionos_api_key
      # Format: {public_prefix}.{secret}  (IONOS developer portal)
      IONOS_API_KEY={{ vault_acme.secret.ionos_api_key }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: traefik_acme_enabled | bool

- name: "[traefik] Write empty .env when ACME disabled (keeps compose valid)"
  ansible.builtin.copy:
    dest: "{{ traefik_compose_dir }}/.env"
    content: "# ACME disabled — set traefik_acme_enabled=true to activate IONOS DNS-01\n"
    owner: root
    group: root
    mode: "0600"
  when: not (traefik_acme_enabled | bool)

- name: "[traefik] Write acme-wildcard.yml anchor route"
  ansible.builtin.template:
    src: acme-wildcard.yml.j2
    dest: "{{ traefik_dynamic_dir }}/acme-wildcard.yml"
    mode: "0644"
  when:
    - traefik_acme_enabled | bool
    - traefik_acme_domain | length > 0

- name: "[traefik] Remove acme-wildcard.yml when ACME disabled"
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/acme-wildcard.yml"
    state: absent
  when: not (traefik_acme_enabled | bool)

# ---- Static config (templated — includes ACME block when enabled) -----------
- name: "[traefik] Template traefik.yml static config"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    mode: "0644"

# ---- Shared middleware definitions (file provider) --------------------------
- name: "[traefik] Copy shared middleware dynamic config"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/platform/traefik/dynamic/middlewares.yml"
    dest: "{{ traefik_dynamic_dir }}/middlewares.yml"
    mode: "0644"

# ---- Authelia forwardauth middleware (file provider) ------------------------
# Defines `authelia@file` and `authelia-2fa@file` used by all other routers.
# Authelia must be deployed BEFORE Traefik restarts in deploy_all.yml.
- name: "[traefik] Write Authelia forwardauth middleware config"
  ansible.builtin.template:
    src: authelia-middleware.yml.j2
    dest: "{{ traefik_dynamic_dir }}/authelia-middleware.yml"
    mode: "0644"

# ---- Docker compose stack ---------------------------------------------------
- name: "[traefik] Copy docker-compose.yml"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/platform/traefik/docker-compose.yml"
    dest: "{{ traefik_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: "[traefik] Pull Traefik image"
  community.docker.docker_image:
    name: "{{ traefik_image }}"
    source: pull

- name: "[traefik] Deploy Traefik"
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_compose_dir }}"
    state: present

- name: "[traefik] Wait for port 8080 to open"
  ansible.builtin.wait_for:
    port: 8080
    host: 127.0.0.1
    timeout: 30

- name: "[traefik] Verify Traefik API responds"
  ansible.builtin.uri:
    url: "http://localhost:8080/api/version"
    method: GET
    status_code: 200
  register: traefik_version
  retries: 6
  delay: 5
  until: traefik_version.status == 200

- name: "[traefik] Version"
  ansible.builtin.debug:
    msg: "Traefik {{ traefik_version.json.Version }} running"
