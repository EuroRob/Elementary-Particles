---
# =============================================================================
# Role: proxmox_host — tasks/build_templates.yml
#
# Creates Debian and Ubuntu cloud-init VM templates from official cloud images.
# Runs ONCE on the designated template builder host (typically pve-01).
# Templates are stored on the NAS shared storage so all PVE hosts can access them.
#
# After creation, templates are synced to pve-02/03 by template_sync.yml.
# =============================================================================

- name: "TMPL-BUILD: Install required tools"
  ansible.builtin.apt:
    name:
      - libguestfs-tools   # virt-customize for template customisation
      - wget
      - curl
    state: present
  tags: [templates, build]

- name: "TMPL-BUILD: Create working directory"
  ansible.builtin.file:
    path: /tmp/pve-template-build
    state: directory
    mode: "0755"
  tags: [templates, build]

# ---------------------------------------------------------------------------
# Process each template definition
# ---------------------------------------------------------------------------
- name: "TMPL-BUILD: Build template {{ item.id }} — {{ item.name }}"
  ansible.builtin.include_tasks: build_template_single.yml
  loop: "{{ pve_templates }}"
  loop_control:
    loop_var: tmpl
    label: "{{ tmpl.id }} — {{ tmpl.name }}"
  tags: [templates, build]
