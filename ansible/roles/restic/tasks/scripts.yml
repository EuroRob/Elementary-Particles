---
# =============================================================================
# restic — scripts.yml
# Render per-job backup scripts from templates and place in restic_scripts_dir.
# One script per job — named after the job (e.g., backup-docker-volumes.sh).
# =============================================================================

- name: "[restic] Deploy forget/prune script"
  ansible.builtin.template:
    src: forget.sh.j2
    dest: "{{ restic_scripts_dir }}/forget.sh"
    owner: root
    group: root
    mode: "0750"

- name: "[restic] Deploy offsite copy script"
  ansible.builtin.template:
    src: copy-offsite.sh.j2
    dest: "{{ restic_scripts_dir }}/copy-offsite.sh"
    owner: root
    group: root
    mode: "0750"
  when: restic_offsite_enabled | bool

- name: "[restic] Deploy integrity check script"
  ansible.builtin.template:
    src: check.sh.j2
    dest: "{{ restic_scripts_dir }}/check.sh"
    owner: root
    group: root
    mode: "0750"

- name: "[restic] Deploy alert helper script"
  ansible.builtin.template:
    src: alert.sh.j2
    dest: "{{ restic_scripts_dir }}/alert.sh"
    owner: root
    group: root
    mode: "0750"

- name: "[restic] Deploy job scripts"
  ansible.builtin.template:
    src: "backup-{{ item.type }}.sh.j2"
    dest: "{{ restic_scripts_dir }}/backup-{{ item.name }}.sh"
    owner: root
    group: root
    mode: "0750"
  loop: "{{ restic_jobs }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }})"
