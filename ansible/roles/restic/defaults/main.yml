---
# =============================================================================
# Role: restic — defaults
# Generic backup role using Restic.
# Override per-host in inventory host_vars or group_vars.
# =============================================================================

# --- Restic binary -----------------------------------------------------------
restic_version: "0.17.3"
restic_install_dir: /usr/local/bin
restic_checksum_url: "https://github.com/restic/restic/releases/download/v{{ restic_version }}/SHA256SUMS"
restic_download_url: "https://github.com/restic/restic/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_linux_amd64.bz2"

# --- Directories -------------------------------------------------------------
restic_config_dir: /etc/restic
restic_scripts_dir: /opt/restic/scripts
restic_log_dir: /var/log/restic
restic_cache_dir: /var/cache/restic

# --- Primary backend (MinIO S3 on NAS) ---------------------------------------
restic_primary_endpoint: "http://nas-01.internal:9000"
restic_primary_bucket: "restic"
restic_primary_repo: "s3:{{ restic_primary_endpoint }}/{{ restic_primary_bucket }}/{{ inventory_hostname }}"

# --- Offsite backend (IONOS S3) ----------------------------------------------
restic_offsite_enabled: true
restic_offsite_endpoint: "https://s3-eu-central-1.ionoscloud.com"
restic_offsite_bucket: "backup-homelab-restic"
restic_offsite_repo: "s3:{{ restic_offsite_endpoint }}/{{ restic_offsite_bucket }}/{{ inventory_hostname }}"

# --- Vault paths -------------------------------------------------------------
vault_restic_primary_path: secret/restic/primary   # keys: access_key, secret_key, password
vault_restic_offsite_path: secret/restic/offsite   # keys: access_key, secret_key

# --- Retention policy --------------------------------------------------------
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12
restic_keep_yearly: 2
restic_prune: true

# --- Alerting ----------------------------------------------------------------
restic_alert_webhook: "http://n8n.internal/webhook/backup-alert"

# --- Jobs — OVERRIDE in host_vars -------------------------------------------
# Each job:
#   name        : unique slug → script name + systemd unit name
#   type        : files | postgres | docker
#   schedule    : OnCalendar= value, e.g. "*-*-* 02:00:00"
#   paths       : list of paths to back up (files + docker types)
#   excludes    : list of patterns to exclude (files + docker types)
#   compose_dirs: list of compose project dirs to pause/unpause (docker type only)
#   databases   : "all" or list of db names (postgres type only)
#   pg_host     : postgres host (postgres type, default localhost)
#   pg_user     : postgres user (postgres type, default postgres)
#   pg_port     : postgres port (postgres type, default 5432)
restic_jobs: []

# Example (paste into host_vars):
